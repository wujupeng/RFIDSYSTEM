# RFID Asset Management System Configuration

[database]
host = localhost
port = 5432
database = rfid_db
user = postgres
password = password
max_connections = 20
connection_timeout = 3

[server]
port = 50051
listen_address = 0.0.0.0

[logging]
level = info
file_path = /var/log/rfid/server.log
max_size = 10485760
max_files = 5

[rfid]
reader_type = simulator
serial_port = /dev/ttyUSB0
tcp_host = 192.168.1.100
tcp_port = 4001