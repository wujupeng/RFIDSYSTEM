syntax = "proto3";

package spatial;

service SpatialStreamService {
    rpc SubscribeSpatialStream(SpatialStreamRequest) returns (stream SpatialFrame);
    rpc GetAssetDetail(AssetRequest) returns (AssetDetail);
    rpc GetHistoricalTrajectory(TrajectoryRequest) returns (HistoricalTrajectory);
}

message SpatialStreamRequest {
    string factory_id = 1;
    bool include_heatmap = 2;
    bool include_congestion = 3;
    int32 update_interval_ms = 4;
}

message SpatialFrame {
    int64 timestamp = 1;
    repeated AssetPosition assets = 2;
    repeated HeatCell heatmap = 3;
    repeated CongestionZone congestion_zones = 4;
    BanditStats bandit_stats = 5;
}

message AssetPosition {
    int32 asset_id = 1;
    string asset_name = 2;
    string tag_id = 3;
    double x = 4;
    double y = 5;
    double vx = 6;
    double vy = 7;
    double risk_score = 8;
    AssetState state = 9;
    float size = 10;
    
    repeated BanditAction bandit_actions = 11;
    string top_action = 12;
    double top_score = 13;
}

enum AssetState {
    NORMAL = 0;
    OBSERVE = 1;
    INSPECT = 2;
    SECURITY_ALERT = 3;
}

message BanditAction {
    string action_type = 1;
    double score = 2;
}

message HeatCell {
    int32 x = 1;
    int32 y = 2;
    float value = 3;
}

message CongestionZone {
    int32 id = 1;
    string name = 2;
    double x = 3;
    double y = 4;
    double radius = 5;
    double congestion_score = 6;
    int32 device_count = 7;
    float avg_stay_time_minutes = 8;
    float inflow_rate = 9;
    float outflow_rate = 10;
}

message BanditStats {
    double exploration_rate = 1;
    int32 total_decisions = 2;
    int32 inspect_count = 3;
    int32 alert_count = 4;
    int32 no_action_count = 5;
    double avg_confidence = 6;
}

message AssetRequest {
    int32 asset_id = 1;
}

message AssetDetail {
    int32 asset_id = 1;
    string asset_name = 2;
    string tag_id = 3;
    string asset_type = 4;
    string location = 5;
    double risk_score = 6;
    repeated RiskFactor risk_factors = 7;
    repeated BanditAction bandit_actions = 8;
}

message RiskFactor {
    string name = 1;
    double score = 2;
    string description = 3;
}

message TrajectoryRequest {
    int32 asset_id = 1;
    int64 start_time = 2;
    int64 end_time = 3;
}

message HistoricalTrajectory {
    int32 asset_id = 1;
    repeated TrajectoryPoint points = 2;
}

message TrajectoryPoint {
    double x = 1;
    double y = 2;
    int64 timestamp = 3;
    string location = 4;
}