syntax = "proto3";

package spatial;

message AssetPosition {
    int32 asset_id = 1;
    string asset_name = 2;
    string tag_id = 3;
    double x = 4;
    double y = 5;
    double vx = 6;
    double vy = 7;
    double risk_score = 8;
    int32 state = 9;
    float size = 10;
    
    // Bandit info
    map<string, double> action_scores = 11;
    string top_action = 12;
    double top_score = 13;
    
    // Prediction
    double predicted_x = 14;
    double predicted_y = 15;
    double prediction_confidence = 16;
}

message HeatCell {
    int32 x = 1;
    int32 y = 2;
    float value = 3;
}

message CongestionZone {
    int32 id = 1;
    string name = 2;
    float x = 3;
    float y = 4;
    float radius = 5;
    float density = 6;
    int32 asset_count = 7;
    string level = 8; // "NORMAL", "HIGH_DENSITY", "CONGESTED"
}

message DecisionPoint {
    int32 asset_id = 1;
    string action = 2;
    double confidence = 3;
    double expected_reward = 4;
    string reason = 5;
}

message PathPrediction {
    int32 asset_id = 1;
    double x = 2;
    double y = 3;
    double confidence = 4;
    int64 timestamp = 5;
}

message SpatialFrame {
    int64 timestamp = 1;
    uint64 frame_id = 2;
    
    repeated AssetPosition assets = 3;
    repeated HeatCell heatmap = 4;
    repeated CongestionZone congestion = 5;
    repeated DecisionPoint decisions = 6;
    repeated PathPrediction predictions = 7;
    
    // Frame metadata
    double processing_time_ms = 8;
    bool is_key_frame = 9;
    
    // For deterministic verification
    uint64 frame_hash = 10;
}